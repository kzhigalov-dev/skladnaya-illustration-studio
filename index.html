<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Складная — студия иллюстраций</title><link rel="stylesheet" href="style.css"><header><strong>◈ Складная</strong><span>Студия иллюстраций</span><button id="save">Скачать SVG ↓</button></header><main><aside><h2>Композиция</h2><label>Источник<select id="mode"><option>По заголовку</option><option>По предметам</option></select></label><label for="query" id="promptLabel">Заголовок или метафора</label><textarea id="query" rows="3">Учусь управлять деньгами</textarea><button class="primary" id="generate">Собрать композицию ↗</button><p id="status" role="status"></p><h2>Библиотека</h2><div id="library"></div></aside><section class="work"><div class="bar"><h1>Монтажный стол</h1><button id="vary">Другая раскладка ↻</button></div><div class="board"><svg id="canvas" aria-label="Холст иллюстрации" tabindex="0" xmlns="http://www.w3.org/2000/svg"></svg></div><div class="caption"><span id="dimensions"></span><span>SVG · вектор</span></div></section><aside><h2>Холст</h2><label>Формат<select id="format"><option>1200 × 630</option><option>1000 × 1000</option><option>800 × 1200</option></select></label><label>Детализация<select id="detail"><option>L</option><option>S</option></select></label><label>Цветовая схема<select id="palette"><option>Лаванда</option><option>Абрикос</option><option>Аквамарин</option></select></label><div id="chips"></div><label class="upload">Загрузить палитру JSON<input id="upload" type="file" accept=".json,application/json"></label><a href="palette.json" download>Образец палитры ↓</a><h2>Слои</h2><div id="layers"></div><fieldset id="edit"><legend>Выбранный предмет</legend><label><input type="checkbox" id="mono"> Фоновый объект</label><div class="controls"><button data-op="left">←</button><button data-op="up">↑</button><button data-op="down">↓</button><button data-op="right">→</button><button data-op="rotate">Повернуть 15°</button><button data-op="copy">Дублировать</button><button data-op="front">На передний</button><button data-op="rear">На задний</button><button data-op="remove">Удалить</button></div></fieldset></aside></main><script src="assets.js"></script><script src="flowers.js"></script><script src="studio.js"></script></html>
